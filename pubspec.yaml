name: abdalsalam_logic_flutter
description: Comprehensive Flutter logic package with modular app state management, networking, storage, auth, and 20+ reusable services following SOLID principles.
version: 0.1.0
homepage: https://github.com/AbdAlmalik/abdalsalam_logic_flutter
repository: https://github.com/AbdAlmalik/abdalsalam_logic_flutter
issue_tracker: https://github.com/AbdAlmalik/abdalsalam_logic_flutter/issues

environment:
  sdk: '>=3.10.1 <4.0.0'
  flutter: '>=3.10.1'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  get_it: ^7.6.4
  injectable: ^2.3.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  firebase_auth: ^4.15.3
  connectivity_plus: ^5.0.2
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  share_plus: ^7.2.1
  path: ^1.8.3
  intl: ^0.19.0
  equatable: ^2.0.5
  permission_handler: ^12.0.1
  battery_plus: ^5.0.2
  network_info_plus: ^5.0.1
  disk_space_plus: ^0.2.2
  volume_controller: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.abdalsalam.logic.flutter
        pluginClass: AbdalsalamLogicFlutterPlugin
      ios:
        pluginClass: AbdalsalamLogicFlutterPlugin
